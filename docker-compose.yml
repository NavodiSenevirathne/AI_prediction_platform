# Run the whole platform locally:
#   docker compose up --build
# API        http://localhost:8000/docs
# Dashboard  http://localhost:8501
# MLflow UI  http://localhost:5000
#
# Retrain against the local MLflow server:
#   docker compose --profile pipeline run --rm retrain
# Stream simulated traffic:
#   docker compose --profile pipeline run --rm simulator

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:-local-admin-token}
    volumes:
      - prediction-logs:/app/data
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts "*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped

  retrain:
    profiles: ["pipeline"]
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: >
      sh -c "pip install -q -r requirements/train.txt &&
             python -m src.pipelines.retrain --drift 0.8"
    depends_on:
      - mlflow

  simulator:
    profiles: ["pipeline"]
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "pip install -q -r requirements/dashboard.txt &&
             python scripts/simulate_traffic.py --url http://api:8000 --n 500 --rate 20"
    depends_on:
      - api

volumes:
  prediction-logs:
  mlflow-data:
