# Continuous Deployment: test -> build & push versioned images to GitHub
# Container Registry -> trigger Render deploy -> verify the live service.
#
# Runs on every push to main, manually, and is called by the retraining
# workflow after a new model is promoted.
#
# Required repository settings (Settings -> Secrets and variables -> Actions):
#   secrets.RENDER_API_DEPLOY_HOOK        deploy hook URL of the API service
#   secrets.RENDER_DASHBOARD_DEPLOY_HOOK  deploy hook URL of the dashboard service
#   vars.API_URL                          public URL of the API (for the smoke test)
name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "reports/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to deploy
        type: string
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: pytest
        env:
          DISABLE_MLFLOW: "1"

  build-and-push:
    name: Build & push images (GHCR)
    needs: test
    runs-on: ubuntu-latest
    outputs:
      model_version: ${{ steps.meta.outputs.model_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Image names and model version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "model_version=$(python3 -c 'import json;print(json.load(open("models/metadata.json"))["version"])')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}/api:latest
            ${{ steps.meta.outputs.image }}/api:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image }}/api:model-v${{ steps.meta.outputs.model_version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}/dashboard:latest
            ${{ steps.meta.outputs.image }}/dashboard:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

  deploy:
    name: Deploy to Render
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.API_URL }}
    env:
      API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
      DASHBOARD_HOOK: ${{ secrets.RENDER_DASHBOARD_DEPLOY_HOOK }}
      API_URL: ${{ vars.API_URL }}
      EXPECTED_VERSION: ${{ needs.build-and-push.outputs.model_version }}
    steps:
      - name: Trigger Render deploys
        run: |
          if [ -z "$API_HOOK" ]; then
            echo "::warning::RENDER_API_DEPLOY_HOOK secret not set - skipping deployment"
            exit 0
          fi
          curl -sf -X POST "$API_HOOK" > /dev/null && echo "API deploy triggered"
          if [ -n "$DASHBOARD_HOOK" ]; then
            curl -sf -X POST "$DASHBOARD_HOOK" > /dev/null && echo "Dashboard deploy triggered"
          fi

      - name: Wait for new version to go live
        run: |
          if [ -z "$API_URL" ] || [ -z "$API_HOOK" ]; then
            echo "::warning::API_URL variable not set - skipping live verification"
            exit 0
          fi
          echo "Waiting for $API_URL to serve model v$EXPECTED_VERSION ..."
          for i in $(seq 1 40); do
            live=$(curl -s --max-time 20 "$API_URL/health" | python3 -c "import sys,json;print(json.load(sys.stdin)['model_version'])" 2>/dev/null || echo "")
            echo "attempt $i: live model version = ${live:-unreachable}"
            if [ "$live" = "$EXPECTED_VERSION" ]; then
              echo "Deployment verified"
              break
            fi
            sleep 30
          done
          [ "$live" = "$EXPECTED_VERSION" ] || { echo "::error::deployment not verified"; exit 1; }

      - name: Production smoke test
        if: env.API_URL != '' && env.API_HOOK != ''
        run: |
          curl -sf -X POST "$API_URL/predict" -H "Content-Type: application/json" \
            -d '{"age":34,"tenure_months":5,"monthly_charges":89.5,"total_charges":447.5,
                 "num_support_calls":4,"avg_daily_usage_gb":6.2,"contract_type":"month_to_month",
                 "internet_service":"fiber","payment_method":"electronic_check"}'
          echo
          echo "### Deployed model v$EXPECTED_VERSION to $API_URL" >> "$GITHUB_STEP_SUMMARY"
