# Continuous Integration: lint, test, build both Docker images and smoke-test
# the API container on every push and pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit & integration tests
        env:
          DISABLE_MLFLOW: "1"
        run: pytest -v

      - name: Model quality gate (production model)
        run: |
          python - <<'EOF'
          import json
          from src.data.generate import generate_customers
          from src.training.model import evaluate, load_production_model

          model, meta, _ = load_production_model()
          metrics = evaluate(model, generate_customers(5000, drift=0.0, seed=2024))
          print(f"Production model v{meta['version']} metrics: {json.dumps(metrics)}")
          assert metrics["roc_auc"] >= 0.75, "production model below quality gate"
          EOF

  docker:
    name: Build & smoke-test images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t churn-api:ci -f Dockerfile .

      - name: Build dashboard image
        run: docker build -t churn-dashboard:ci -f Dockerfile.dashboard .

      - name: Smoke test API container
        run: |
          docker run -d --name api -p 8000:8000 churn-api:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":34,"tenure_months":5,"monthly_charges":89.5,"total_charges":447.5,
                 "num_support_calls":4,"avg_daily_usage_gb":6.2,"contract_type":"month_to_month",
                 "internet_service":"fiber","payment_method":"electronic_check"}'
          echo
          docker logs api
          docker rm -f api
